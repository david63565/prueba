<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página Prueba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f2f5f1;
  --surface: #ffffff;
  --ink: #12201b;
  --muted: #55645e;
  --line: #d3dcd6;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1714; --surface: #17211d; --ink: #eaf1ed; --muted: #9fb0a8; --line: #2a3832; --accent: #6b8cff; --accent-ink: #0b1220;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1714; --surface: #17211d; --ink: #eaf1ed; --muted: #9fb0a8; --line: #2a3832; --accent: #6b8cff; --accent-ink: #0b1220;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
.logo { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
nav { display: flex; gap: 24px; }
nav a { color: var(--muted); text-decoration: none; font-weight: 600; }
nav a:hover, nav a:focus-visible { color: var(--ink); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.hero { padding: 72px 0 56px; }
h1 { font-size: clamp(2.6rem, 8vw, 5.2rem); line-height: 1; letter-spacing: -0.035em; font-weight: 800; margin: 0 0 20px; max-width: 14ch; }
.hero p { font-size: 1.15rem; color: var(--muted); max-width: 46ch; margin: 0; }
#pago { padding: 24px 0 96px; }
.pay { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 32px; display: grid; gap: 24px; grid-template-columns: 1fr auto; align-items: center; }
.pay h2 { margin: 0 0 8px; font-size: 1.8rem; letter-spacing: -0.02em; }
.pay p { margin: 0; color: var(--muted); max-width: 44ch; }
.btn { display: inline-block; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 800; font-size: 1.1rem; padding: 16px 32px; border-radius: 6px; text-decoration: none; text-align: center; transition: transform .15s ease; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: .9rem; }
@media (max-width: 640px) {
  .pay { grid-template-columns: 1fr; padding: 24px; }
  nav { gap: 16px; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Página Prueba</div>
    <nav aria-label="Principal">
      <a href="#inicio">Inicio</a>
      <a href="#pago">Pago</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="inicio">
      <h1>Los mejores Lives.</h1>
      <p>Pagina de pruebas.</p>
    </section>

    <section id="pago" aria-labelledby="pago-titulo">
      <div class="pay">
        <div>
          <h2 id="pago-titulo">Pago</h2>
          <p>Al continuar te llevamos al sitio seguro de tu banco para completar el pago.</p>
        </div>
        <!-- CAMBIA AQUÍ el enlace del banco: reemplaza el valor de href -->
        <a class="btn" id="btn-pago" href="https://pagostarjetadecredito.apps.bancolombia.com/#/inicio" rel="noopener noreferrer">Pagar ahora</a>
      </div>
    </section>
  </main>

  <footer>© 2026 Página Prueba</footer>
</div>
</body>
</html>
